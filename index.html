<style>
  :root {
    --bg1:#eef3ee; --bg2:#f7f4ec; --card:#ffffff; --ink:#1f2a22; --sub:#75806f;
    --line:#e3e8df; --accent1:#4a7c59; --accent2:#6fa27e; --shadow:0 2px 10px rgba(40,60,45,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg1:#141a15; --bg2:#191d18; --card:#212822; --ink:#eef2ec; --sub:#8f9a89;
      --line:#2e362f; --accent1:#5d9370; --accent2:#7fb08d; --shadow:0 2px 10px rgba(0,0,0,.35);
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%); color:var(--ink);
         min-height:100vh; font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
         -webkit-font-smoothing:antialiased; }
  .wrap { max-width:480px; margin:0 auto; padding:44px 18px 60px; }
  .avatar { width:84px; height:84px; margin:0 auto; border-radius:50%;
             background:linear-gradient(135deg,var(--accent1),var(--accent2));
             display:flex; align-items:center; justify-content:center;
             font-size:40px; box-shadow:var(--shadow); }
  h1 { margin-top:14px; font-size:23px; text-align:center; letter-spacing:-0.5px; }
  .intro { margin-top:8px; text-align:center; color:var(--sub); font-size:14px; line-height:1.65; }
  .list { margin-top:26px; display:flex; flex-direction:column; gap:11px; }
  .btn { display:flex; align-items:center; gap:13px; background:var(--card);
          border:1px solid var(--line); border-radius:16px; padding:15px 16px;
          text-decoration:none; color:var(--ink); font-size:15.5px; font-weight:600;
          box-shadow:var(--shadow); transition:transform .06s ease; }
  .btn:active { transform:scale(0.975); }
  .thumb { flex:0 0 52px; width:52px; height:52px; border-radius:12px;
            object-fit:cover; background:var(--line); }
  .num { flex:0 0 32px; height:32px; border-radius:50%;
          background:linear-gradient(135deg,var(--accent1),var(--accent2));
          color:#fff; font-size:14px; font-weight:700; display:flex;
          align-items:center; justify-content:center; }
  .name { flex:1; line-height:1.4; }
  .new { flex:0 0 auto; background:#e8542f; color:#fff; font-size:10.5px; font-weight:800;
          letter-spacing:.5px; border-radius:99px; padding:3px 8px; }
  .arrow { flex:0 0 auto; color:var(--sub); font-size:20px; line-height:1; }
  .notice { margin-top:32px; text-align:center; color:var(--sub); font-size:11.5px; line-height:1.7; }
</style>
